<svg viewBox="0 0 1200 8" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f0b429" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffe9b8" stop-opacity="1"/>
      <stop offset="100%" stop-color="#f0b429" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="1.2"/></filter>
  </defs>

  <!-- dim base line -->
  <rect x="0" y="3" width="1200" height="2" fill="#f0b429" opacity="0.25"/>

  <!-- running highlight -->
  <rect x="-300" y="0" width="300" height="8" fill="url(#sweep)" filter="url(#glow)">
    <animate attributeName="x" values="-300;1200" dur="2.4s" repeatCount="indefinite"/>
  </rect>
</svg>
