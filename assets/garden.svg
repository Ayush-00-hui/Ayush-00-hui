<svg viewBox="0 0 1200 260" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="gbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#140f08"/>
      <stop offset="100%" stop-color="#1f160c"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#f0b429" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#f0b429" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="260" fill="url(#gbg)"/>
  <rect width="1200" height="260" fill="url(#glow)"/>

  <!-- fireflies -->
  <g fill="#ffe9b8">
    <circle cx="120" cy="50" r="1.6"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="980" cy="40" r="1.4"><animate attributeName="opacity" values="0.8;0.1;0.8" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="600" cy="30" r="1.5"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="3.6s" repeatCount="indefinite"/></circle>
    <circle cx="820" cy="70" r="1.2"><animate attributeName="opacity" values="0.7;0.15;0.7" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="300" cy="65" r="1.3"><animate attributeName="opacity" values="0.15;0.8;0.15" dur="4.4s" repeatCount="indefinite"/></circle>
  </g>

  <!-- ground -->
  <rect x="0" y="230" width="1200" height="30" fill="#241a0e"/>
  <path d="M0 230 Q600 220 1200 230" stroke="#3a2c17" stroke-width="2" fill="none"/>

  <!-- small grass tufts -->
  <g stroke="#5c7a4a" stroke-width="2" stroke-linecap="round" opacity="0.7">
    <path d="M60 230 l-3 -10 M60 230 l0 -12 M60 230 l3 -10"/>
    <path d="M260 230 l-3 -9 M260 230 l0 -11 M260 230 l3 -9"/>
    <path d="M460 230 l-3 -10 M460 230 l0 -12 M460 230 l3 -10"/>
    <path d="M760 230 l-3 -9 M760 230 l0 -11 M760 230 l3 -9"/>
    <path d="M960 230 l-3 -10 M960 230 l0 -12 M960 230 l3 -10"/>
    <path d="M1120 230 l-3 -9 M1120 230 l0 -11 M1120 230 l3 -9"/>
  </g>

  <!-- flower template used 5 times with different positions/colors/timing -->

  <!-- flower 1 -->
  <g transform="translate(140,230)">
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-3;3;-3" dur="3.2s" repeatCount="indefinite"/>
      <path d="M0 0 C -6 -30 6 -50 0 -78" stroke="#4d7a4a" stroke-width="4" fill="none"/>
      <path d="M0 -30 C -14 -26 -20 -14 -18 -6" stroke="#4d7a4a" stroke-width="3" fill="none"/>
      <g transform="translate(0,-78)">
        <g>
          <animateTransform attributeName="transform" type="scale" values="0.85;1;0.85" dur="2.6s" repeatCount="indefinite"/>
          <g fill="#f2b6c6">
            <ellipse cx="0" cy="-10" rx="7" ry="11"/>
            <ellipse cx="9" cy="-3" rx="7" ry="11" transform="rotate(72 9 -3)"/>
            <ellipse cx="6" cy="8" rx="7" ry="11" transform="rotate(144 6 8)"/>
            <ellipse cx="-6" cy="8" rx="7" ry="11" transform="rotate(216 -6 8)"/>
            <ellipse cx="-9" cy="-3" rx="7" ry="11" transform="rotate(288 -9 -3)"/>
          </g>
          <circle cx="0" cy="0" r="5" fill="#f0b429"/>
        </g>
      </g>
    </g>
  </g>

  <!-- flower 2 -->
  <g transform="translate(330,230)">
    <g>
      <animateTransform attributeName="transform" type="rotate" values="3;-3;3" dur="3.6s" repeatCount="indefinite"/>
      <path d="M0 0 C 6 -28 -4 -46 0 -68" stroke="#4d7a4a" stroke-width="4" fill="none"/>
      <g transform="translate(0,-68)">
        <g>
          <animateTransform attributeName="transform" type="scale" values="1;0.85;1" dur="3s" repeatCount="indefinite"/>
          <g fill="#c9b7ea">
            <ellipse cx="0" cy="-9" rx="6" ry="9"/>
            <ellipse cx="8" cy="-2" rx="6" ry="9" transform="rotate(72 8 -2)"/>
            <ellipse cx="5" cy="7" rx="6" ry="9" transform="rotate(144 5 7)"/>
            <ellipse cx="-5" cy="7" rx="6" ry="9" transform="rotate(216 -5 7)"/>
            <ellipse cx="-8" cy="-2" rx="6" ry="9" transform="rotate(288 -8 -2)"/>
          </g>
          <circle cx="0" cy="0" r="4.5" fill="#ffe9b8"/>
        </g>
      </g>
    </g>
  </g>

  <!-- flower 3, tall centerpiece -->
  <g transform="translate(600,230)">
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-2.5;2.5;-2.5" dur="4s" repeatCount="indefinite"/>
      <path d="M0 0 C -8 -34 8 -60 0 -92" stroke="#4d7a4a" stroke-width="5" fill="none"/>
      <path d="M0 -40 C 16 -34 22 -20 20 -10" stroke="#4d7a4a" stroke-width="3" fill="none"/>
      <path d="M0 -55 C -18 -50 -24 -38 -22 -28" stroke="#4d7a4a" stroke-width="3" fill="none"/>
      <g transform="translate(0,-92)">
        <g>
          <animateTransform attributeName="transform" type="scale" values="0.9;1.05;0.9" dur="3.4s" repeatCount="indefinite"/>
          <g fill="#f7c9a0">
            <ellipse cx="0" cy="-12" rx="8" ry="13"/>
            <ellipse cx="11" cy="-4" rx="8" ry="13" transform="rotate(72 11 -4)"/>
            <ellipse cx="7" cy="10" rx="8" ry="13" transform="rotate(144 7 10)"/>
            <ellipse cx="-7" cy="10" rx="8" ry="13" transform="rotate(216 -7 10)"/>
            <ellipse cx="-11" cy="-4" rx="8" ry="13" transform="rotate(288 -11 -4)"/>
          </g>
          <circle cx="0" cy="0" r="6" fill="#f0b429"/>
        </g>
      </g>
    </g>
  </g>

  <!-- flower 4 -->
  <g transform="translate(870,230)">
    <g>
      <animateTransform attributeName="transform" type="rotate" values="3;-3;3" dur="3s" repeatCount="indefinite"/>
      <path d="M0 0 C 5 -30 -5 -48 0 -72" stroke="#4d7a4a" stroke-width="4" fill="none"/>
      <g transform="translate(0,-72)">
        <g>
          <animateTransform attributeName="transform" type="scale" values="1;0.88;1" dur="2.8s" repeatCount="indefinite"/>
          <g fill="#fff3d6">
            <ellipse cx="0" cy="-9" rx="6" ry="10"/>
            <ellipse cx="8.5" cy="-3" rx="6" ry="10" transform="rotate(72 8.5 -3)"/>
            <ellipse cx="5" cy="8" rx="6" ry="10" transform="rotate(144 5 8)"/>
            <ellipse cx="-5" cy="8" rx="6" ry="10" transform="rotate(216 -5 8)"/>
            <ellipse cx="-8.5" cy="-3" rx="6" ry="10" transform="rotate(288 -8.5 -3)"/>
          </g>
          <circle cx="0" cy="0" r="4.5" fill="#e07856"/>
        </g>
      </g>
    </g>
  </g>

  <!-- flower 5 -->
  <g transform="translate(1050,230)">
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-3;3;-3" dur="3.8s" repeatCount="indefinite"/>
      <path d="M0 0 C -5 -26 5 -42 0 -64" stroke="#4d7a4a" stroke-width="4" fill="none"/>
      <g transform="translate(0,-64)">
        <g>
          <animateTransform attributeName="transform" type="scale" values="0.85;1;0.85" dur="3.2s" repeatCount="indefinite"/>
          <g fill="#f2b6c6">
            <ellipse cx="0" cy="-8" rx="5.5" ry="9"/>
            <ellipse cx="7.5" cy="-2" rx="5.5" ry="9" transform="rotate(72 7.5 -2)"/>
            <ellipse cx="4.5" cy="7" rx="5.5" ry="9" transform="rotate(144 4.5 7)"/>
            <ellipse cx="-4.5" cy="7" rx="5.5" ry="9" transform="rotate(216 -4.5 7)"/>
            <ellipse cx="-7.5" cy="-2" rx="5.5" ry="9" transform="rotate(288 -7.5 -2)"/>
          </g>
          <circle cx="0" cy="0" r="4" fill="#ffe9b8"/>
        </g>
      </g>
    </g>
  </g>

  <!-- butterfly 1, fluttering left to right -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="60,140; 1140,60; 60,140" keyTimes="0;0.5;1" dur="18s" repeatCount="indefinite"/>
    <g>
      <animateTransform attributeName="transform" type="scale" values="1,1; 0.6,1; 1,1" dur="0.4s" repeatCount="indefinite"/>
      <path d="M0 0 C -10 -12 -18 -6 -14 4 C -10 12 -2 8 0 0" fill="#e8a87c" opacity="0.9"/>
      <path d="M0 0 C 10 -12 18 -6 14 4 C 10 12 2 8 0 0" fill="#e8a87c" opacity="0.9"/>
    </g>
    <ellipse cx="0" cy="0" rx="1.2" ry="5" fill="#2a1f14"/>
  </g>

  <!-- butterfly 2, fluttering the other way -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="1120,180; 100,90; 1120,180" keyTimes="0;0.5;1" dur="22s" repeatCount="indefinite"/>
    <g>
      <animateTransform attributeName="transform" type="scale" values="1,1; 0.6,1; 1,1" dur="0.35s" repeatCount="indefinite"/>
      <path d="M0 0 C -8 -10 -15 -5 -11 3 C -8 10 -2 6 0 0" fill="#f2b6c6" opacity="0.9"/>
      <path d="M0 0 C 8 -10 15 -5 11 3 C 8 10 2 6 0 0" fill="#f2b6c6" opacity="0.9"/>
    </g>
    <ellipse cx="0" cy="0" rx="1" ry="4" fill="#2a1f14"/>
  </g>
</svg>
