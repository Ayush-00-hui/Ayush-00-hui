<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="100%" height="280">
  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 800; font-size: 42px; fill: #f8fafc; }
    .subtitle { font-family: monospace; font-size: 13px; font-weight: 600; letter-spacing: 4px; fill: #94a3b8; }
    .vibe { font-family: monospace; font-size: 14px; fill: #cbd5e1; }
  </style>

  <!-- Background Canvas -->
  <rect width="900" height="280" rx="16" fill="#12161f" stroke="#21262d" stroke-width="2"/>

  <!-- Left Header Information -->
  <text x="50" y="85" class="title">Ayush Arya</text>
  <text x="50" y="115" class="subtitle">BUILDING RESILIENT SYSTEMS &amp; ELEGANT CODE</text>
  <text x="50" y="210" class="vibe">me and who ?</text>

  <!-- Desk Scene & Kitty Cat -->
  <g transform="translate(420, 30)">
    <!-- Desk Surface -->
    <rect x="0" y="180" width="440" height="8" rx="3" fill="#1e2430" />
    <rect x="30" y="188" width="8" height="30" rx="2" fill="#151b23" />
    <rect x="400" y="188" width="8" height="30" rx="2" fill="#151b23" />

    <!-- Left Screen: Matrix Cyber Terminal & Stream -->
    <g transform="translate(35, 60)">
      <rect width="105" height="90" rx="4" fill="#0d1117" stroke="#334155" stroke-width="1.5" />
      <rect x="3" y="3" width="99" height="84" rx="2" fill="#080c12" />
      <!-- Matrix Cascades -->
      <g font-family="monospace" font-size="5" font-weight="bold">
        <g>
          <animateTransform attributeName="transform" type="translate" values="8,-20; 8,80" dur="2.4s" repeatCount="indefinite" />
          <text x="0" y="0" fill="#39d353">1</text>
          <text x="0" y="7" fill="#22c55e">0</text>
          <text x="0" y="14" fill="#16a34a">&#955;</text>
          <text x="0" y="21" fill="#15803d">1</text>
          <text x="0" y="28" fill="#ffffff">0</text>
        </g>
        <g>
          <animateTransform attributeName="transform" type="translate" values="24,-15; 24,85" dur="1.8s" repeatCount="indefinite" />
          <text x="0" y="0" fill="#22c55e">0</text>
          <text x="0" y="7" fill="#16a34a">x</text>
          <text x="0" y="14" fill="#15803d">7</text>
          <text x="0" y="21" fill="#39d353">F</text>
          <text x="0" y="28" fill="#ffffff">1</text>
        </g>
        <g>
          <animateTransform attributeName="transform" type="translate" values="40,-25; 40,75" dur="2.9s" repeatCount="indefinite" />
          <text x="0" y="0" fill="#16a34a">&lt;</text>
          <text x="0" y="7" fill="#22c55e">/</text>
          <text x="0" y="14" fill="#39d353">&gt;</text>
          <text x="0" y="21" fill="#15803d">0</text>
          <text x="0" y="28" fill="#ffffff">1</text>
        </g>
        <g>
          <animateTransform attributeName="transform" type="translate" values="56,-10; 56,90" dur="2.1s" repeatCount="indefinite" />
          <text x="0" y="0" fill="#39d353">G</text>
          <text x="0" y="7" fill="#22c55e">I</text>
          <text x="0" y="14" fill="#16a34a">T</text>
          <text x="0" y="21" fill="#15803d">1</text>
          <text x="0" y="28" fill="#ffffff">0</text>
        </g>
        <g>
          <animateTransform attributeName="transform" type="translate" values="72,-30; 72,70" dur="2.6s" repeatCount="indefinite" />
          <text x="0" y="0" fill="#22c55e">4</text>
          <text x="0" y="7" fill="#16a34a">2</text>
          <text x="0" y="14" fill="#15803d">0</text>
          <text x="0" y="21" fill="#39d353">1</text>
          <text x="0" y="28" fill="#ffffff">8</text>
        </g>
        <g>
          <animateTransform attributeName="transform" type="translate" values="88,-18; 88,82" dur="2.3s" repeatCount="indefinite" />
          <text x="0" y="0" fill="#16a34a">&#123;</text>
          <text x="0" y="7" fill="#39d353">&#125;</text>
          <text x="0" y="14" fill="#22c55e">1</text>
          <text x="0" y="21" fill="#15803d">0</text>
          <text x="0" y="28" fill="#ffffff">F</text>
        </g>
      </g>
      <!-- Telemetry footer -->
      <rect x="3" y="73" width="99" height="14" fill="#0b1118" opacity="0.95" />
      <text x="6" y="82" font-size="5" font-weight="bold" fill="#34d399" font-family="monospace">KERNEL 6.12 · 4.8GHz</text>
      <text x="74" y="82" font-size="5" font-weight="bold" fill="#38bdf8" font-family="monospace">RAM 18%</text>
    </g>

    <!-- Middle Screen: Terminal / Code ("middle one is correct") -->
    <rect x="155" y="45" width="105" height="98" rx="4" fill="#090d16" stroke="#334155" stroke-width="2" />
    <line x1="165" y1="65" x2="205" y2="65" stroke="#34d399" stroke-width="2" stroke-linecap="round" />
    <line x1="165" y1="78" x2="245" y2="78" stroke="#64748b" stroke-width="1.5" stroke-dasharray="3 2" />
    <line x1="165" y1="91" x2="230" y2="91" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
    <line x1="165" y1="104" x2="220" y2="104" stroke="#cbd5e1" stroke-width="1.5" />
    <rect x="225" y="102" width="4" height="5" fill="#34d399">
      <animate attributeName="opacity" values="1;0;1" dur="0.9s" repeatCount="indefinite" />
    </rect>

    <!-- Right Screen: Song Player Monitor with Vinyl, Floating Notes & Soundwaves -->
    <g transform="translate(345, 60)">
      <!-- Floating Notes -->
      <g>
        <animateTransform attributeName="transform" type="translate" values="18,10; 12,-15; 22,-30" dur="2.8s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0;1;0" dur="2.8s" repeatCount="indefinite" />
        <text font-size="10" fill="#38bdf8" font-weight="bold">&#9834;</text>
      </g>
      <g>
        <animateTransform attributeName="transform" type="translate" values="36,5; 42,-15; 34,-35" dur="3.2s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0;1;0" dur="3.2s" repeatCount="indefinite" />
        <text font-size="12" fill="#34d399" font-weight="bold">&#9835;</text>
      </g>
      <g>
        <animateTransform attributeName="transform" type="translate" values="48,12; 42,-10; 52,-25" dur="2.4s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0;1;0" dur="2.4s" repeatCount="indefinite" />
        <text font-size="9" fill="#f472b6" font-weight="bold">&#9836;</text>
      </g>

      <rect width="65" height="95" rx="4" fill="#0d1117" stroke="#334155" stroke-width="1.5" />
      <rect x="3" y="3" width="59" height="89" rx="2" fill="#090e17" />
      
      <!-- Acoustic Sound Wave Rings -->
      <g transform="translate(32, 26)">
        <circle cx="0" cy="0" r="16" fill="none" stroke="#34d399" stroke-width="0.8">
          <animate attributeName="r" values="16;28" dur="1.8s" repeatCount="indefinite" />
          <animate attributeName="opacity" values="0.8;0" dur="1.8s" repeatCount="indefinite" />
        </circle>
        <circle cx="0" cy="0" r="16" fill="none" stroke="#38bdf8" stroke-width="0.8">
          <animate attributeName="r" values="16;28" dur="1.8s" begin="0.6s" repeatCount="indefinite" />
          <animate attributeName="opacity" values="0.8;0" dur="1.8s" begin="0.6s" repeatCount="indefinite" />
        </circle>

        <!-- Spinning vinyl disc -->
        <circle cx="0" cy="0" r="16" fill="#0a0a0c" stroke="#1f2937" stroke-width="1" />
        <circle cx="0" cy="0" r="12" fill="none" stroke="#27272a" stroke-width="0.75" />
        <circle cx="0" cy="0" r="6" fill="#10b981" />
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="3.5s" repeatCount="indefinite" />
      </g>
      <text x="6" y="54" font-size="5" font-weight="bold" fill="#38bdf8" font-family="monospace">STROKES</text>
      <text x="6" y="61" font-size="4" fill="#94a3b8" font-family="monospace">The Adults Are Talking</text>
      <!-- Audio bars -->
      <g transform="translate(6, 67)">
        <rect x="0" y="0" width="5" height="12" rx="1" fill="#10b981"><animate attributeName="height" values="4;14;2;10;4" dur="1.1s" repeatCount="indefinite" /></rect>
        <rect x="8" y="0" width="5" height="12" rx="1" fill="#34d399"><animate attributeName="height" values="9;3;14;7;9" dur="0.9s" repeatCount="indefinite" /></rect>
        <rect x="16" y="0" width="5" height="12" rx="1" fill="#38bdf8"><animate attributeName="height" values="12;5;9;14;12" dur="1.3s" repeatCount="indefinite" /></rect>
        <rect x="24" y="0" width="5" height="12" rx="1" fill="#f472b6"><animate attributeName="height" values="6;13;4;9;6" dur="1.0s" repeatCount="indefinite" /></rect>
        <rect x="32" y="0" width="5" height="12" rx="1" fill="#fbbf24"><animate attributeName="height" values="11;7;13;5;11" dur="0.8s" repeatCount="indefinite" /></rect>
      </g>
    </g>

    <!-- THE DEVELOPER SEATED IN ERGONOMIC GAMING CHAIR -->
    <g transform="translate(205, 82)">
      <!-- Chair Backrest -->
      <path d="M-22 45 C-26 22 -22 4 -14 0 C-6 -3 6 -3 14 0 C22 4 26 22 22 45 C20 62 18 82 18 96 L-18 96 C-18 82 -20 62 -22 45 Z" fill="#131924" stroke="#2b384e" stroke-width="2" />
      <path d="M-18 42 C-21 22 -13 9 -8 5" stroke="#10b981" stroke-width="1.5" fill="none" opacity="0.85" />
      <path d="M18 42 C21 22 13 9 8 5" stroke="#10b981" stroke-width="1.5" fill="none" opacity="0.85" />
      <rect x="-12" y="2" width="24" height="13" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <rect x="-30" y="64" width="7" height="24" rx="2.5" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <rect x="23" y="64" width="7" height="24" rx="2.5" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <rect x="-3" y="96" width="6" height="22" fill="#334155" />
      <path d="M-22 118 L0 115 L22 118" stroke="#1e293b" stroke-width="4" stroke-linecap="round" />
      <!-- Head & Hair -->
      <circle cx="0" cy="24" r="14" fill="#0b0f17" />
      <path d="M-13 22 C-13 11 13 11 13 22 C13 15 0 13 -13 22 Z" fill="#1e293b" />
      <!-- Gaming Headphones -->
      <path d="M-15 24 C-15 6 15 6 15 24" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" />
      <rect x="-18" y="19" width="5.5" height="13" rx="2.5" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" />
      <rect x="12.5" y="19" width="5.5" height="13" rx="2.5" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" />
      <!-- Hoodie & Arms -->
      <path d="M-22 55 C-22 38 -15 36 0 36 C15 36 22 38 22 55 L20 86 L-20 86 Z" fill="#1a2332" stroke="#2b3b52" stroke-width="1.5" />
      <path d="M-19 55 Q-25 76 -13 90" fill="none" stroke="#1a2332" stroke-width="7" stroke-linecap="round" />
      <path d="M19 55 Q25 76 13 90" fill="none" stroke="#1a2332" stroke-width="7" stroke-linecap="round" />
      <circle cx="-13" cy="91" r="3.5" fill="#fcd34d" />
      <circle cx="13" cy="91" r="3.5" fill="#fcd34d" />
    </g>

    <!-- THE KITTY CAT SITTING ON DESK -->
    <g transform="translate(305, 140)">
      <ellipse cx="14" cy="26" rx="10" ry="12" fill="#ffffff" />
      <circle cx="14" cy="12" r="9" fill="#ffffff" />
      <polygon points="6,6 10,1 12,8" fill="#ffffff" />
      <polygon points="7,5 10,2 11,7" fill="#fbcfe8" />
      <polygon points="16,8 18,1 22,6" fill="#ffffff" />
      <polygon points="17,7 18,2 21,5" fill="#fbcfe8" />
      <path d="M10 11 Q12 13 14 11" stroke="#334155" stroke-width="1.2" fill="none" />
      <path d="M16 11 Q18 13 20 11" stroke="#334155" stroke-width="1.2" fill="none" />
      <path d="M22 32 Q32 28 30 18 Q28 14 26 12" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" fill="none" />
    </g>

    <!-- Warm Coffee Mug -->
    <g transform="translate(420, 150)">
      <rect x="0" y="8" width="16" height="18" rx="2" fill="#d97706" />
      <path d="M16 11 C21 11 21 21 16 21" fill="none" stroke="#d97706" stroke-width="2.5" />
    </g>
  </g>
</svg>
