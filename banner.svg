<svg viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0b12"/>
      <stop offset="55%" stop-color="#12121c"/>
      <stop offset="100%" stop-color="#1a1a2b"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f4e3c4" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#d4a574" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#d4a574" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="deskGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d4a574" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#d4a574" stop-opacity="0"/>
    </radialGradient>
    <filter id="blurSoft"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="blurWide"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="screenGlow"><feGaussianBlur stdDeviation="1.4"/></filter>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>

  <!-- stars -->
  <g fill="#e8e8e8">
    <circle cx="120" cy="40" r="1.4" opacity="0.7"><animate attributeName="opacity" values="0.15;0.85;0.15" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="260" cy="70" r="1" opacity="0.5"><animate attributeName="opacity" values="0.7;0.15;0.7" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="340" cy="30" r="1.6" opacity="0.6"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="470" cy="55" r="1.1" opacity="0.5"><animate attributeName="opacity" values="0.8;0.2;0.8" dur="3.6s" repeatCount="indefinite"/></circle>
    <circle cx="560" cy="25" r="1.3" opacity="0.6"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="640" cy="60" r="1" opacity="0.5"><animate attributeName="opacity" values="0.6;0.15;0.6" dur="4.4s" repeatCount="indefinite"/></circle>
    <circle cx="80" cy="90" r="1" opacity="0.4"><animate attributeName="opacity" values="0.3;0.7;0.3" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="200" cy="110" r="0.9" opacity="0.4"><animate attributeName="opacity" values="0.7;0.2;0.7" dur="3.8s" repeatCount="indefinite"/></circle>
    <circle cx="380" cy="95" r="1" opacity="0.4"><animate attributeName="opacity" values="0.25;0.75;0.25" dur="4.6s" repeatCount="indefinite"/></circle>
  </g>

  <!-- moon -->
  <circle cx="1020" cy="66" r="70" fill="url(#moonGlow)" filter="url(#blurWide)"/>
  <circle cx="1020" cy="66" r="26" fill="#f4e3c4"/>
  <circle cx="1030" cy="58" r="24" fill="#0b0b12" opacity="0.55"/>

  <!-- status line, top right -->
  <text x="1140" y="34" text-anchor="end" font-family="JetBrains Mono, monospace" font-size="12" fill="#6a6a7a">02:14 · heads down</text>

  <!-- desk glow -->
  <ellipse cx="900" cy="255" rx="260" ry="60" fill="url(#deskGlow)" filter="url(#blurSoft)"/>

  <!-- title block -->
  <text x="70" y="140" font-family="JetBrains Mono, monospace" font-weight="700" font-size="58" fill="#e8a87c">AYUSH ARYA</text>
  <text x="72" y="172" font-family="JetBrains Mono, monospace" font-size="17" fill="#8a8a9e" letter-spacing="1">AI/ML ENGINEER &#183; AUTOMATION &#183; APPLIED INTELLIGENCE</text>

  <text x="72" y="215" font-family="JetBrains Mono, monospace" font-size="16" fill="#d4a574">&gt; building agents that run unattended<tspan fill="#d4a574" opacity="1">_</tspan></text>
  <rect x="497" y="202" width="9" height="16" fill="#d4a574">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>

  <text x="72" y="248" font-family="JetBrains Mono, monospace" font-size="13" fill="#5f5f70">delhi, india &#8226; open to work</text>

  <!-- little cat, bottom-left corner easter egg -->
  <g transform="translate(70,268)" fill="#1c1c28" stroke="#3a3a4a" stroke-width="1">
    <path d="M0 14 L4 4 L8 10 L12 4 L16 14 Z"/>
    <circle cx="8" cy="16" r="8"/>
  </g>

  <!-- desk -->
  <rect x="760" y="258" width="400" height="8" rx="2" fill="#232335"/>
  <rect x="760" y="266" width="400" height="4" fill="#14141d"/>

  <!-- monitor 1 -->
  <g>
    <rect x="800" y="150" width="120" height="86" rx="5" fill="#101018" stroke="#33334a" stroke-width="1.5"/>
    <rect x="850" y="236" width="20" height="14" fill="#232335"/>
    <rect x="836" y="250" width="48" height="6" rx="2" fill="#232335"/>
    <g filter="url(#screenGlow)">
      <rect x="810" y="160" width="60" height="4" fill="#d4a574" opacity="0.85"/>
      <rect x="810" y="170" width="42" height="4" fill="#d4a574" opacity="0.6"/>
      <rect x="810" y="180" width="70" height="4" fill="#d4a574" opacity="0.75"/>
      <rect x="810" y="190" width="30" height="4" fill="#d4a574" opacity="0.5"/>
      <rect x="810" y="200" width="55" height="4" fill="#d4a574" opacity="0.7"/>
      <rect x="810" y="210" width="66" height="4" fill="#d4a574" opacity="0.55"/>
    </g>
  </g>

  <!-- monitor 2 -->
  <g>
    <rect x="945" y="140" width="130" height="94" rx="5" fill="#101018" stroke="#33334a" stroke-width="1.5"/>
    <rect x="1000" y="234" width="22" height="16" fill="#232335"/>
    <rect x="984" y="250" width="54" height="6" rx="2" fill="#232335"/>
    <g filter="url(#screenGlow)">
      <rect x="957" y="152" width="30" height="30" fill="#d4a574" opacity="0.18"/>
      <rect x="993" y="152" width="70" height="4" fill="#d4a574" opacity="0.7"/>
      <rect x="993" y="162" width="50" height="4" fill="#d4a574" opacity="0.5"/>
      <rect x="957" y="188" width="106" height="4" fill="#d4a574" opacity="0.65"/>
      <rect x="957" y="198" width="80" height="4" fill="#d4a574" opacity="0.5"/>
      <rect x="957" y="208" width="94" height="4" fill="#d4a574" opacity="0.6"/>
      <rect x="957" y="218" width="60" height="4" fill="#d4a574" opacity="0.45"/>
    </g>
  </g>

  <!-- silhouette -->
  <g fill="#05050a">
    <ellipse cx="905" cy="222" rx="46" ry="30"/>
    <circle cx="905" cy="176" r="20"/>
    <path d="M885 168 q20 -22 40 0 l-4 -14 q-16 -12 -32 0 Z"/>
  </g>
  <!-- headphone glow arc -->
  <path d="M888 168 a18 18 0 0 1 34 0" stroke="#d4a574" stroke-width="2" fill="none" opacity="0.6"/>

  <!-- coffee cup -->
  <g>
    <rect x="1090" y="240" width="16" height="16" rx="2" fill="#232335"/>
    <path d="M1106 244 q8 0 8 6 t-8 6" stroke="#232335" stroke-width="3" fill="none"/>
    <rect x="1093" y="234" width="10" height="4" rx="1" fill="#d4a574" opacity="0.5"/>
  </g>
</svg>
